volumes:
  mongo_data:

networks:
  lan_postes:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.10.0/24

  lan_serveurs:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.20.0/24

  lan_admin:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.40.0/24