services:
  backend:
    build: .
    ports:
      - "80:80"
    volumes:
      - .:/app
  mongo_db:
    image: mongo:latest
    container_name: mongo_db
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: mydb
    volumes:
      - mongo_data:/data/db

  mongo-express:
    image: mongo-express:latest
    container_name: mongo-express
    restart: always
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: password
      ME_CONFIG_MONGODB_URL: mongodb://admin:password@mongo_db:27017/
    depends_on:
      - mongo_db

  frontend:
    build: ./dashboard
    container_name: react
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./dashboard:/app
      - /app/node_modules
    depends_on:
      - backend


#Machines simulées sur lesquelles l'agent tourne
  poste1:
    build: 
      context: ./agent
      dockerfile: Dockerfile
    environment:
      - BACKEND_URL=http://backend:80
    depends_on:
      - backend

  poste2:
      build: 
        context: ./agent
        dockerfile: Dockerfile
      environment:
        - BACKEND_URL=http://backend:80
      depends_on:
        - backend
volumes:
  mongo_data: